#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.use16KBPageSize=true

#Release
# Single source for the Android app version. Bump versionCode by one for every
# Play upload; versionName follows semantic versioning.
alphakids.versionCode=1
alphakids.versionName=1.0.0
